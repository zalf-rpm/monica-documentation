site_name: MONICA Documentation
site_description: Model for Nitrogen and Carbon in Agro-ecosystems
site_url: https://zalf-rpm.github.io/monica-documentation/
repo_url: https://github.com/zalf-rpm/monica-documentation
repo_name: monica-documentation

theme:
    name: material
    font: false
    palette:
      primary: green
      accent: light green
    features:
      - navigation.tabs
      - navigation.tabs.sticky
      - navigation.expand
      - toc.integrate

extra:
  generator: false

markdown_extensions:
  - toc:
      toc_depth: 3
  - pymdownx.superfences:
        custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - User Guide:
      - Installation and Setup: 
          - Windows installation: user_guide/Installation_and_Setup/windows_installation.md
          - Windows compilation: user_guide/Installation_and_Setup/windows_compilation.md
          - Linux compilation: user_guide/Installation_and_Setup/linux_installation.md
          - MONICA server: user_guide/Installation_and_Setup/monica_server.md
          - Rundeck setup: user_guide/Installation_and_Setup/rundeck_setup.md
          - Python Support and Dependencies: user_guide/Installation_and_Setup/dependencies_and_python.md
          - Troubleshooting Common Installation Issues: user_guide/Installation_and_Setup/troubleshooting_installation.md
      - Configuration Files:
          - Overview: user_guide/configuration_files/config_overview.md
          - sim.json: user_guide/configuration_files/config_sim_json.md
          - crop.json: user_guide/configuration_files/config_crop_json.md
          - site.json: user_guide/configuration_files/config_site_json.md
      - How to run: 
          - Running MONICA from the Command Line: user_guide/how_to_run/command_line.md
          - Running MONICA in Docker: user_guide/how_to_run/docker.md
          - Running with Singularity: user_guide/how_to_run/singularity.md
          - Running on HPC: user_guide/how_to_run/hpc.md
          - Python API usage examples: user_guide/how_to_run/python_api_usage.md
  - Parameter Reference and Calibration:
      - Crop Parameters:
          - Overview: parameters/crop_parameters/overview.md
          - Species parameters: parameters/crop_parameters/species_parameters.md
          - Cultivar parameters: parameters/crop_parameters/cultivar_parameters.md
          - Crop residue parameters: parameters/crop_parameters/crop_residue_parameters.md
      - Soil parameters: 
          - Soil organic parameters: parameters/soil_parameters/soil_organic_parameters.md
          - Soil moisture parameters: parameters/soil_parameters/soil_moisture_parameters.md
          - Soil temperature parameters: parameters/soil_parameters/soil_temperature_parameters.md
          - Soil transport parameters: parameters/soil_parameters/soil_transport_parameters.md
      - Management parameters: 
          - Mineral fertiliser parameters: parameters/management_parameters/mineral_fertiliser_parameters.md
          - Organic fertiliser parameters: parameters/management_parameters/organic_fertiliser_parameters.md
      - General parameters: 
          - Environmental parameters: parameters/general_parameters/environment_parameters.md
          - Crop parameters: parameters/general_parameters/crop_parameters.md
  - Validation and Testing: model_testing_and_applications.md
  - Model Science and Algorithm:
      - Soil Processes:
          - Overview: model_science/soil_processes/overview.md
          - Soil temperature: model_science/soil_processes/soil_temperature.md
          - Evaporation: model_science/soil_processes/evaporation.md
          - Soil moisture: model_science/soil_processes/soil_moisture.md
          - Soil frost: model_science/soil_processes/soil_frost.md
          - Snow: model_science/soil_processes/snow.md
          - Organic matter turn-over: model_science/soil_processes/organic_matter_turn-over.md
